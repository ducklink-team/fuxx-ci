name: Manutenzione

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  scegli:
    name: Scegli runner
    permissions:
      contents: read
    uses: ducklink-team/fuxx-ci/.github/workflows/scegli-runner.yml@2185778c917d7143660402e5abe6a21c09dadbab # v10
    with:
      versione-ci: v10
      fallback: ${{ vars.CI_RUNNER || '"ubuntu-latest"' }}
    secrets:
      RUNNER_LETTURA: ${{ secrets.RUNNER_LETTURA }}

  manutenzione:
    name: Manutenzione
    needs: scegli
    runs-on: ${{ fromJSON(needs.scegli.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - name: Checkout con storia completa
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Aggiornamento e controllo dipendenze
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Controllo sicurezza con npm audit
        run: npm audit --audit-level=high

      - name: Pulizia rami uniti e artefatti vecchi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/manutenzione.mjs
