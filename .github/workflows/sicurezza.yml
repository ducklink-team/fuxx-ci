name: Sicurezza riutilizzabile
on:
  workflow_call:
    inputs:
      linguaggio:
        type: string
        required: true
        description: node oppure python
      directory:
        type: string
        default: .
      requirements:
        type: string
        default: requirements.txt
      versione-ci:
        type: string
        default: v1
    secrets:
      LETTURA_CI:
        required: true
        description: Token di sola lettura contents per il repository privato fuxx-ci
permissions:
  contents: read
jobs:
  sicurezza:
    name: Sicurezza
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ducklink-team/fuxx-ci
          ref: ${{ inputs.versione-ci }}
          token: ${{ secrets.LETTURA_CI }}
          path: __fuxx_ci
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Valida linguaggio
        env:
          LINGUAGGIO: ${{ inputs.linguaggio }}
        run: node -e 'if (!["node", "python"].includes(process.env.LINGUAGGIO)) throw new Error("linguaggio deve essere node o python")'
      - name: Gitleaks 8.30.1 con verifica checksum
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$RUNNER_TEMP/gitleaks-checksums.txt"
          (cd "$RUNNER_TEMP" && grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks-checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact -v .
      # Semgrep CE, regole pubbliche, senza login: https://semgrep.dev/products/community-edition
      - name: Installa Semgrep Community
        run: python -m pip install semgrep
      - name: Analisi statica bloccante
        working-directory: ${{ inputs.directory }}
        run: semgrep scan --config p/security-audit --error --metrics=off --exclude '__fuxx_ci/**' .
      - name: Dipendenze Node senza script di installazione
        if: inputs.linguaggio == 'node'
        working-directory: ${{ inputs.directory }}
        run: npm ci --ignore-scripts
      - name: Audit Node bloccante high
        if: inputs.linguaggio == 'node'
        working-directory: ${{ inputs.directory }}
        run: npm audit --audit-level=high
      - name: Inventario licenze Node
        if: inputs.linguaggio == 'node'
        working-directory: ${{ inputs.directory }}
        run: npx --yes --package license-checker-rseidelsohn@5.0.1 license-checker-rseidelsohn --json --out "$RUNNER_TEMP/licenze.json"
      - name: Strumenti Python in ambiente separato
        if: inputs.linguaggio == 'python'
        run: |
          python -m venv "$RUNNER_TEMP/fuxx-audit"
          "$RUNNER_TEMP/fuxx-audit/bin/python" -m pip install pip-audit pip-licenses
      - name: Audit Python bloccante
        if: inputs.linguaggio == 'python'
        working-directory: ${{ inputs.directory }}
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: '"$RUNNER_TEMP/fuxx-audit/bin/pip-audit" --strict -r "$REQUIREMENTS"'
      - name: Inventario licenze Python in ambiente progetto
        if: inputs.linguaggio == 'python'
        working-directory: ${{ inputs.directory }}
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: |
          python -m venv "$RUNNER_TEMP/fuxx-progetto"
          "$RUNNER_TEMP/fuxx-progetto/bin/python" -m pip install -r "$REQUIREMENTS"
          "$RUNNER_TEMP/fuxx-audit/bin/pip-licenses" --python "$RUNNER_TEMP/fuxx-progetto/bin/python" --format=json > "$RUNNER_TEMP/licenze.json"
      - name: Licenze fuori lista solo avviso
        env:
          LINGUAGGIO: ${{ inputs.linguaggio }}
        run: node __fuxx_ci/scripts/licenze.mjs "$RUNNER_TEMP/licenze.json"
