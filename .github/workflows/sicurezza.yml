name: Sicurezza riutilizzabile
on:
  workflow_call:
    inputs:
      linguaggio:
        type: string
        required: true
        description: node oppure python
      directory:
        type: string
        default: .
      requirements:
        type: string
        default: requirements.txt
      versione-ci:
        type: string
        default: v1
    secrets:
      LETTURA_CI:
        required: true
        description: Token di sola lettura contents per il repository privato fuxx-ci
permissions:
  contents: read
jobs:
  sicurezza:
    name: Sicurezza
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ducklink-team/fuxx-ci
          ref: ${{ inputs.versione-ci }}
          token: ${{ secrets.LETTURA_CI }}
          path: __fuxx_ci
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Valida linguaggio
        env:
          LINGUAGGIO: ${{ inputs.linguaggio }}
        run: node -e 'if (!["node", "python"].includes(process.env.LINGUAGGIO)) throw new Error("linguaggio deve essere node o python")'
      - name: Gitleaks 8.30.1 con verifica checksum
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$RUNNER_TEMP/gitleaks-checksums.txt"
          (cd "$RUNNER_TEMP" && grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks-checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP" gitleaks
          # Config scritta da questo workflow, non letta dal checkout di versione-ci: l'allowlist di .gitleaks.toml
          # del progetto e i gitleaks:allow della PR non spengono la scansione. Un .gitleaksignore del progetto resta valido.
          cat > "$RUNNER_TEMP/gitleaks-fuxx.toml" <<'TOML'
          title = "fuxx-ci"

          [extend]
          useDefault = true
          TOML
          "$RUNNER_TEMP/gitleaks" git --redact -v --config "$RUNNER_TEMP/gitleaks-fuxx.toml" --ignore-gitleaks-allow .
      # Semgrep CE, regole pubbliche, senza login: https://semgrep.dev/products/community-edition
      - name: Installa Semgrep Community
        run: python -m pip install semgrep
      - name: Analisi statica bloccante
        working-directory: ${{ inputs.directory }}
        # --disable-nosem: i commenti nosemgrep della PR non disattivano i finding. --no-git-ignore: il .gitignore della PR non nasconde file.
        run: semgrep scan --config p/security-audit --error --metrics=off --no-git-ignore --disable-nosem --exclude '__fuxx_ci/**' .
      - name: Dipendenze Node senza script di installazione
        if: inputs.linguaggio == 'node'
        working-directory: ${{ inputs.directory }}
        run: npm ci --ignore-scripts
      - name: Audit Node bloccante high
        if: inputs.linguaggio == 'node'
        working-directory: ${{ inputs.directory }}
        run: npm audit --audit-level=high
      - name: Installa strumento licenze Node
        if: inputs.linguaggio == 'node'
        working-directory: ${{ runner.temp }}
        run: npm install --ignore-scripts --no-save --prefix "$RUNNER_TEMP/fuxx-licenze" license-checker-rseidelsohn@5.0.1
      - name: Inventario licenze Node
        if: inputs.linguaggio == 'node'
        working-directory: ${{ inputs.directory }}
        run: "$RUNNER_TEMP/fuxx-licenze/node_modules/.bin/license-checker-rseidelsohn" --start . --json --out "$RUNNER_TEMP/licenze.json"
      - name: Strumenti Python in ambiente separato
        if: inputs.linguaggio == 'python'
        run: |
          python -m venv "$RUNNER_TEMP/fuxx-audit"
          "$RUNNER_TEMP/fuxx-audit/bin/python" -m pip install pip-audit
      - name: Dipendenze Python solo wheel in target isolato
        if: inputs.linguaggio == 'python'
        working-directory: ${{ inputs.directory }}
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        shell: bash
        run: |
          node __fuxx_ci/scripts/requisiti-sicuri.mjs "$REQUIREMENTS"
          set +e
          "$RUNNER_TEMP/fuxx-audit/bin/python" -m pip install --only-binary=:all: --target "$RUNNER_TEMP/fuxx-py-progetto" -r "$REQUIREMENTS" 2>&1 | tee "$RUNNER_TEMP/fuxx-pip-install.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            package=$(sed -n 's/.*Could not find a version that satisfies the requirement \([^ ]*\).*/\1/p' "$RUNNER_TEMP/fuxx-pip-install.log" | head -n 1)
            echo "pacchetto senza wheel: ${package:-requisito in $REQUIREMENTS}"
            exit "$status"
          fi
      - name: Audit Python bloccante
        if: inputs.linguaggio == 'python'
        run: '"$RUNNER_TEMP/fuxx-audit/bin/pip-audit" --strict --path "$RUNNER_TEMP/fuxx-py-progetto"'
      - name: Inventario licenze Python dai metadati
        if: inputs.linguaggio == 'python'
        run: |
          "$RUNNER_TEMP/fuxx-audit/bin/python" -I -c 'import json,sys,importlib.metadata as m; print(json.dumps([{"Name":d.metadata["Name"],"Version":d.version,"License":d.metadata.get("License-Expression") or d.metadata.get("License") or "UNKNOWN"} for d in m.distributions(path=[sys.argv[1]])]))' "$RUNNER_TEMP/fuxx-py-progetto" > "$RUNNER_TEMP/licenze.json"
      - name: Licenze fuori lista solo avviso
        env:
          LINGUAGGIO: ${{ inputs.linguaggio }}
        run: node __fuxx_ci/scripts/licenze.mjs "$RUNNER_TEMP/licenze.json"
