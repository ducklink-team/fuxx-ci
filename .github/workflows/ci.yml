name: CI propria

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scegli:
    name: Scegli runner
    uses: ducklink-team/fuxx-ci/.github/workflows/scegli-runner.yml@v11
    with:
      versione-ci: v11
      fallback: ${{ vars.CI_RUNNER || '"ubuntu-latest"' }}

  test:
    needs: scegli
    runs-on: ${{ fromJSON(needs.scegli.outputs.runner) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installa PyYAML
        run: python -m pip install pyyaml
      - name: Controlla i workflow con actionlint
        uses: rhysd/actionlint@v1.7.7
      - name: Test
        run: npm test
