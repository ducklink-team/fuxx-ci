# Passata Strix completa sul codice esistente (una tantum, ramo dedicato).
name: Strix passata completa

on:
  push:
    branches: [ci/strix-passata]

permissions:
  contents: read

jobs:
  strix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installa Strix
        run: pipx install strix-agent==1.7.0

      - name: Scansione completa
        env:
          STRIX_LLM: openrouter/z-ai/glm-5.3-flash
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: strix -n -t ./ --scan-mode quick --max-budget 1

      - name: Salva il rapporto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-rapporto
          path: strix_runs/
          if-no-files-found: ignore
