name: Controllo sito riutilizzabile
on:
  workflow_call:
    inputs:
      url:
        type: string
        required: true
        description: URL HTTPS della demo autorizzata
      versione-ci:
        type: string
        default: v1
    secrets:
      LETTURA_CI:
        required: true
permissions:
  contents: read
jobs:
  sito:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ducklink-team/fuxx-ci
          ref: ${{ inputs.versione-ci }}
          token: ${{ secrets.LETTURA_CI }}
          path: __fuxx_ci
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Valida URL prima di avviare scanner
        env:
          DEMO_URL: ${{ inputs.url }}
        run: node --input-type=module -e 'import { controllaUrl } from "./__fuxx_ci/scripts/header.mjs"; controllaUrl(process.env.DEMO_URL)'
      - name: Header di sicurezza
        id: header
        continue-on-error: true
        env:
          DEMO_URL: ${{ inputs.url }}
        run: node __fuxx_ci/scripts/header.mjs
      # Immagine ufficiale: https://www.zaproxy.org/docs/docker/baseline-scan/
      - name: ZAP baseline passivo sulla demo
        id: zap
        continue-on-error: true
        env:
          DEMO_URL: ${{ inputs.url }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/zap"
          chmod 777 "$RUNNER_TEMP/zap"
          set +e
          docker run --rm -v "$RUNNER_TEMP/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "$DEMO_URL" -r rapporto.html -J rapporto.json
          esito=$?
          set -e
          printf '## ZAP baseline\nCodice: %s (0 OK, 1 FAIL, 2 WARN, 3 errore).\n' "$esito" >> "$GITHUB_STEP_SUMMARY"
          if [ "$esito" -eq 2 ]; then
            echo '::warning::ZAP baseline ha segnalato avvisi; consultare il rapporto.'
          elif [ "$esito" -ne 0 ]; then
            exit "$esito"
          fi
      - name: Conserva rapporto ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/zap/
          if-no-files-found: warn
          retention-days: 7
      - name: Esito controlli sito
        if: always()
        env:
          HEADER: ${{ steps.header.outcome }}
          ZAP: ${{ steps.zap.outcome }}
        run: |
          printf '\nHeader: %s; ZAP: %s\n' "$HEADER" "$ZAP" >> "$GITHUB_STEP_SUMMARY"
          test "$HEADER" = success && test "$ZAP" = success
