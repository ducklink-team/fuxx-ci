name: Merge automatico riutilizzabile
on:
  workflow_call:
    inputs:
      controlli:
        type: string
        default: '["CI progetto", "sicurezza / Sicurezza"]'
        description: Nomi esatti dei job obbligatori nel workflow CI
      revisione:
        type: string
        default: Revisione AI
        description: Nome del job di revisione richiesto con modo job-ci
      modo:
        type: string
        default: job-ci
        description: 'Modalita revisione: commento-revisore (consigliato) oppure job-ci (sconsigliato, legacy)'
      versione-ci:
        type: string
        default: v4
      runner:
        type: string
        default: '"ubuntu-latest"'
        description: 'Runner in JSON: "ubuntu-latest" oppure ["self-hosted","fuxx-vps"]'
    secrets:
      LETTURA_CI:
        required: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: merge-${{ github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: false
jobs:
  merge:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    steps:
      # Mai checkout del ramo PR o esecuzione di suoi artefatti con token write.
      - uses: actions/checkout@v5
        with:
          repository: ducklink-team/fuxx-ci
          ref: ${{ inputs.versione-ci }}
          token: ${{ secrets.LETTURA_CI || github.token }}
          path: __fuxx_ci
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Valuta PR e unisci solo se ammessa
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLI_OBBLIGATORI: ${{ inputs.controlli }}
          NOME_REVISIONE: ${{ inputs.revisione }}
          MODO_REVISIONE: ${{ inputs.modo }}
        run: node __fuxx_ci/scripts/merge.mjs
