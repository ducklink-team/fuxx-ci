# Copiare in .github/workflows/ci.yml del progetto (Node).
name: CI progetto
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifica:
    name: CI progetto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build && npm run controlli
  sicurezza:
    uses: ducklink-team/fuxx-ci/.github/workflows/sicurezza.yml@v1
    with:
      linguaggio: node
    secrets:
      LETTURA_CI: ${{ secrets.LETTURA_CI }}
# La revisione AI non sta in questo workflow: il codice della PR non deve mai ricevere la chiave OpenRouter.
# Il revisore locale scrive il commento ESITO sullo SHA di testa, letto da merge-progetto.yml.
# Affiancare merge-progetto.yml: richiama merge-automatico.yml@v2 dopo questo workflow.
